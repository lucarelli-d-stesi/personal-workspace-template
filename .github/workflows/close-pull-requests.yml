name: Close Pull Requests

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  close-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Close and Comment
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `Hi @${context.actor}! 👋
            
            Thank you for your interest in **Personal Workspace (POS)**.
            
            This repository is a personal operating system template and operational base; it does not accept external Pull Requests or contributions.
            
            If you would like to use or adapt this workspace for your own life, study, or work:
            - Click **"Use this template"** (or fork/clone the repository into your own account).
            - Customize your own personal instance under the terms of the MIT License.
            
            Have a great day!`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: comment
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              state: 'closed'
            });
